# ===========================================================================
# .tmux.conf - ngxxfus/coder environment
# Managed by dotfiles (stow: tmux/.tmux.conf -> ~/.tmux.conf)
# ===========================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g default-terminal "screen-256color"   # 256 color support
set -g history-limit 10000                  # Scrollback buffer
set -g mouse on                             # Enable mouse
set -sg escape-time 0                       # No delay for escape key
set -g base-index 1                         # Start window index at 1
setw -g pane-base-index 1                   # Start pane index at 1
set -g renumber-windows on                  # Renumber windows on close

# ---------------------------------------------------------------------------
# Prefix: Ctrl+a (easier than Ctrl+b)
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display-message "[INF] tmux.conf reloaded!"

# Split panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Navigate windows with Shift+arrow
bind -n S-Left  previous-window
bind -n S-Right next-window

# New window keeping current path
bind c new-window -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '